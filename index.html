<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全班秒刷測驗系統</title>
    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 10px; }
        .btn { padding: 15px; font-size: 18px; color: white; border: none; border-radius: 10px; margin: 5px; cursor: pointer; width: 90%; max-width: 400px; font-weight:bold; }
        .btn:disabled { background: #95a5a6 !important; }
        #v { width: 100%; max-width: 400px; display: none; border-radius: 10px; border: 3px solid #333; margin: 10px auto; }
        #res { background: #fff; padding: 10px; border-radius: 8px; margin: 10px auto; max-width: 400px; font-weight: bold; border: 1px solid #ccc; font-size:18px;}
        .q-box { display: none; background: #fff; padding: 15px; border-radius: 10px; margin: 10px auto; max-width: 400px; border: 2px solid #f39c12; text-align: left; }
    </style>
</head>
<body>
    <h2>🔥 全班秒刷測驗系統</h2>
    <div class="q-box" id="q-box">
        <h3 id="q-progress" style="color:#e74c3c; text-align:center;"></h3>
        <h3 id="qt"></h3>
        <div id="opts" style="font-size:18px; line-height:1.5;"></div>
    </div>
    <div>
        <button class="btn" id="startQuizBtn" onclick="startQuiz()" style="background:#f39c12;">🎯 1. 載入本次測驗 (10題)</button>
        <button class="btn" id="nextBtn" onclick="nextQuestion()" style="background:#3498db; display:none;">⏭️ 換下一題</button>
        <button class="btn" id="startBtn" onclick="startScan()" style="background:#27ae60;">🎥 2. 開啟連續掃描</button>
    </div>
    <video id="v" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="c" style="display:none"></canvas>
    <div id="res">🟢 系統準備就緒！</div>

    <script>
        // 👇 換成您的最新網址 👇
        const API_URL = "https://script.google.com/macros/s/AKfycbwgRB1Jk9cmFZex2Mxxoid2fotdFmKpAb60LCuwXWz7JCTtOa6R-nPef-Y0UyMK-Bbj/exec";

        var v = document.getElementById('v'), c = document.getElementById('c'), ctx = c.getContext('2d'), rD = document.getElementById('res');
        var det, scanActive = false, scannedMap = {};
        let quizQs = [], currQIndex = -1;

        function startQuiz() {
            rD.innerHTML = "⏳ 抽題中...";
            fetch(API_URL + "?action=getQuiz&t=" + new Date().getTime())
            .then(res => res.json()).then(data => {
                quizQs = data; currQIndex = -1;
                document.getElementById('startQuizBtn').style.display = "none";
                document.getElementById('nextBtn').style.display = "inline-block";
                nextQuestion(); 
            }).catch(e => rD.innerHTML = "❌ 連線失敗");
        }

        function nextQuestion() {
            currQIndex++;
            let scanBtn = document.getElementById('startBtn'), nxtBtn = document.getElementById('nextBtn');
            if(currQIndex >= quizQs.length) {
                rD.innerHTML = "✅ 測驗結束！"; return;
            }
            let q = quizQs[currQIndex];
            document.getElementById('q-box').style.display = "block";
            document.getElementById('q-progress').innerText = `📝 第 ${currQIndex + 1} 題`;
            document.getElementById('qt').innerText = "題目：" + q.q;
            document.getElementById('opts').innerHTML = `(A) ${q.a} <br>(B) ${q.b} <br>(C) ${q.c} <br>(D) ${q.d}`;
            
            scanBtn.disabled = true; nxtBtn.disabled = true;
            rD.innerHTML = "⏳ 正在同步大螢幕題目...";

            // 🚀 核心重點：使用 Image Beacon 穿透 Safari 攔截！
            let beaconUrl = `${API_URL}?action=setQuestion&q=${encodeURIComponent(q.q)}&a=${encodeURIComponent(q.a)}&b=${encodeURIComponent(q.b)}&c=${encodeURIComponent(q.c)}&d=${encodeURIComponent(q.d)}&ans=${encodeURIComponent(q.ans)}&t=${new Date().getTime()}`;
            let img = new Image();
            img.onload = img.onerror = () => {
                rD.innerHTML = `✅ 同步成功！`;
                scannedMap = {}; scanBtn.disabled = false; nxtBtn.disabled = false;
            };
            img.src = beaconUrl;
        }

        function startScan() {
            if(scanActive) { scanActive = false; v.style.display = "none"; return; }
            det = new AR.Detector();
            navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}}).then(function(s) {
                v.srcObject = s; v.style.display = "block"; scanActive = true;
                requestAnimationFrame(tick);
            });
        }

        function tick() {
            if(!scanActive) return;
            if(v.readyState === v.HAVE_ENOUGH_DATA) {
                c.width = v.videoWidth; c.height = v.videoHeight;
                ctx.drawImage(v, 0, 0, c.width, c.height);
                var markers = det.detect(ctx.getImageData(0, 0, c.width, c.height));
                if(markers.length > 0) {
                    var m = markers[0], id = m.id;
                    var dx = m.corners[1].x - m.corners[0].x, dy = m.corners[1].y - m.corners[0].y;
                    var angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    var ans = (angle > 45 && angle <= 135) ? "D" : (angle > 135 || angle <= -135) ? "C" : (angle > -135 && angle <= -45) ? "B" : "A";

                    if(!scannedMap[id]) {
                        scannedMap[id] = true;
                        let recUrl = `${API_URL}?action=record&id=${id}&ans=${ans}&t=${new Date().getTime()}`;
                        let img = new Image();
                        img.onload = img.onerror = () => { rD.innerHTML = `✅ ${id} 號已送出 ${ans}`; setTimeout(() => { delete scannedMap[id]; }, 5000); };
                        img.src = recUrl;
                    }
                }
            }
            requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
