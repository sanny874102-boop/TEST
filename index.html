<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🔥 全班秒刷-蘋果無敵表單版</title>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"></script>
  <style>
    body{text-align:center;font-family:-apple-system, sans-serif;background:#f4f4f9;padding:10px;margin:0;}
    .btn{font-size:20px;padding:15px;color:white;border:none;border-radius:12px;width:90%;margin:10px auto;display:block;cursor:pointer;font-weight:bold;}
    #res{font-size:16px;font-weight:bold;margin-top:10px;color:#2c3e50;padding:15px;background:#fff;border-radius:12px;border:1px solid #ddd;}
    #q-box{background:white;padding:15px;border-radius:10px;margin-bottom:10px;text-align:left;display:none;border:2px solid #f39c12;}
    video{width:100%;max-width:500px;border-radius:10px;border:3px solid #333;display:none;margin:10px auto;}
  </style>
</head>
<body>
  <h2>🔥 全班秒刷 (終極表單版)</h2>
  <div id="q-box">
    <b id="qt" style="font-size:22px;color:#d35400;">題目載入中...</b><br>
    <div id="opts" style="font-size:18px;line-height:1.6;"></div>
  </div>
  <button class="btn" id="drawBtn" onclick="drawQ()" style="background:#f39c12;">🎲 1. 隨機抽題</button>
  <button class="btn" id="startBtn" onclick="startScan()" style="background:#27ae60;">🎥 2. 開啟連續掃描</button>
  <video id="v" autoplay playsinline webkit-playsinline muted></video>
  <canvas id="c" style="display:none"></canvas>
  <div id="res">🟢 引擎已接通！</div>

  <iframe name="hidden_iframe" style="display:none;"></iframe>
  <form id="gasForm" target="hidden_iframe" method="GET" style="display:none;"></form>

<script>
  // 👇 重要！請貼上讓您 B3 成功變色的那個「個人帳號」Google 網址 👇
  const API_URL = "https://script.google.com/macros/s/AKfycbwN0-ACXfy5iTpsRmnzPhEi2hs23wvIYD90GyjD8IO4dZDQjbQLtU2jrXv6vOT9sw0ljg/exec";

  var v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d'), rD=document.getElementById('res');
  var det, scanActive=false, scannedMap = {}, currentQ = null;

  // 🚀 萬無一失的表單發射器
  function sendViaForm(params) {
    let form = document.getElementById('gasForm');
    form.action = API_URL;
    form.innerHTML = ''; // 清空舊資料
    for (let key in params) {
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = params[key];
        form.appendChild(input);
    }
    form.submit(); // 假裝真人按下送出！
  }

  function drawQ(){
    rD.innerHTML = "⏳ 抽題並同步中...";
    // 拿題目用一般的 fetch 沒問題
    fetch(API_URL + "?action=getQuiz&t=" + new Date().getTime())
    .then(res => res.json()).then(data => {
      if(data && data.length > 0) {
        currentQ = data[0];
        document.getElementById('q-box').style.display="block";
        document.getElementById('qt').innerText="題目："+currentQ.q;
        document.getElementById('opts').innerHTML="(A) "+currentQ.a+"<br>(B) "+currentQ.b+"<br>(C) "+currentQ.c+"<br>(D) "+currentQ.d;
        
        // 🚀 改用「隱形表單提交」來同步大螢幕 B3，100% 穿透 Safari 防火牆！
        sendViaForm({
            action: "setQuestion",
            q: currentQ.q,
            a: currentQ.a,
            b: currentQ.b,
            c: currentQ.c,
            d: currentQ.d,
            ans: currentQ.ans,
            t: new Date().getTime()
        });

        rD.innerHTML = "✅ 大螢幕同步指令已送出！";
        scannedMap = {}; 
      }
    }).catch(e => rD.innerHTML = "❌ 抽題失敗，請檢查網址");
  }

  function startScan(){
    if(scanActive) return;
    if(typeof AR === 'undefined') { alert("辨識引擎載入失敗"); return; }
    det = new AR.Detector();
    navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}})
    .then(function(s){
      v.srcObject=s; v.style.display="block"; scanActive=true;
      rD.innerHTML = "🎥 掃描啟動！";
      document.getElementById('startBtn').innerText = "🛑 停止掃描";
      document.getElementById('startBtn').style.background = "#e74c3c";
      tick();
    }).catch(e => alert("相機錯誤：" + e));
  }

  function tick(){
    if(!scanActive) return;
    if(v.readyState === v.HAVE_ENOUGH_DATA){
      c.width=v.videoWidth; c.height=v.videoHeight;
      ctx.drawImage(v, 0, 0, c.width, c.height);
      var m=det.detect(ctx.getImageData(0, 0, c.width, c.height));
      if(m.length > 0){
        var id = m[0].id;
        if(!scannedMap[id]){
          scannedMap[id] = true;
          var ans = ["A","B","C","D"][m[0].rotation];
          rD.innerHTML = "🔄 傳送: " + id + " 號選 " + ans;
          
          // 🚀 紀錄成績也用表單提交，再也不怕斷線！
          sendViaForm({
              action: "record",
              id: id,
              ans: ans,
              t: new Date().getTime()
          });

          rD.innerHTML = "✅ " + id + " 號傳送成功！";
          setTimeout(() => { delete scannedMap[id]; }, 6000);
        }
      }
    }
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
