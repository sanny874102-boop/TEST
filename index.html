<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終連動測試版</title>
    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .btn { padding: 15px; font-size: 18px; color: white; border: none; border-radius: 12px; margin: 10px; width: 90%; font-weight: bold; }
        #res { background: #fff; padding: 15px; border-radius: 12px; margin: 10px auto; border: 2px solid #ddd; font-size: 16px; word-break: break-all; }
        .debug-info { font-size: 12px; color: #7f8c8d; margin-top: 20px; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🚀 最終連動測試</h2>
    
    <div id="res">🟢 請先按「載入測試」</div>

    <button class="btn" id="loadBtn" onclick="startTest()" style="background:#f39c12;">🎯 載入測試題目</button>
    <button class="btn" id="nextBtn" onclick="sendToGoogle()" style="background:#3498db; display:none;">⏭️ 傳送至大螢幕</button>

    <div class="debug-info">
        <strong>目前使用的網址：</strong><br>
        <span id="debug-url">尚未設定</span>
    </div>

    <script>
        // 👇 請在這裡貼上您複製的 Google 網址 (結尾必須是 /exec) 👇
        const API_URL = "https://script.google.com/macros/s/AKfycbwgRB1Jk9cmFZex2Mxxoid2fotdFmKpAb60LCuwXWz7JCTtOa6R-nPef-Y0UyMK-Bbj/exec";

        document.getElementById('debug-url').innerText = API_URL;
        let testQ = { q: "連動成功", ans: "O", a: "成功", b: "失敗", c: "再試試", d: "加油" };

        function startTest() {
            document.getElementById('res').innerHTML = "📝 準備傳送測試題目：<br><b>" + testQ.q + "</b>";
            document.getElementById('loadBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "block";
        }

        function sendToGoogle() {
            let resDiv = document.getElementById('res');
            resDiv.innerHTML = "⏳ 正在強力傳送中...";
            
            // 🚀 使用最無敵的圖片信號彈技術
            let finalUrl = API_URL + "?action=setQuestion&q=" + encodeURIComponent(testQ.q) + 
                           "&ans=" + encodeURIComponent(testQ.ans) + 
                           "&a=" + encodeURIComponent(testQ.a) + 
                           "&b=" + encodeURIComponent(testQ.b) + 
                           "&c=" + encodeURIComponent(testQ.c) + 
                           "&d=" + encodeURIComponent(testQ.d) + 
                           "&t=" + new Date().getTime();

            console.log("正在發送：" + finalUrl);

            let img = new Image();
            img.onload = img.onerror = function() {
                resDiv.innerHTML = "✅ <b style='color:green'>同步指令已發出！</b><br>請查看大螢幕 B3 是否變成了「連動成功」。";
            };
            img.src = finalUrl;
        }
    </script>
</body>
</html>
