<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🔥 全班秒刷 (終極紫鈕版)</title>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"></script>
  <style>
    body{text-align:center;font-family:-apple-system, sans-serif;background:#f4f4f9;padding:10px;margin:0;}
    .btn{font-size:20px;padding:15px;color:white;border:none;border-radius:12px;width:90%;margin:10px auto;display:block;cursor:pointer;font-weight:bold;text-decoration:none;box-sizing:border-box;}
    #res{font-size:16px;font-weight:bold;margin-top:10px;color:#2c3e50;padding:15px;background:#fff;border-radius:12px;border:1px solid #ddd;}
    #q-box{background:white;padding:15px;border-radius:10px;margin-bottom:10px;text-align:left;display:none;border:2px solid #f39c12;}
    video{width:100%;max-width:500px;border-radius:10px;border:3px solid #333;display:none;margin:10px auto;}
  </style>
</head>
<body>
  <h2>🔥 全班秒刷 (終極紫鈕版)</h2>
  <div id="q-box">
    <b id="qt" style="font-size:22px;color:#d35400;">等待抽題中...</b><br>
    <div id="opts" style="font-size:18px;line-height:1.6;"></div>
  </div>

  <button class="btn" id="drawBtn" onclick="drawQ()" style="background:#f39c12;">🎲 1. 手機抽取題目</button>
  
  <a id="syncBtn" href="#" target="_blank" class="btn" style="background:#8e44ad; display:none;">🚀 2. 將題目發射至大螢幕</a>
  
  <button class="btn" id="startBtn" onclick="startScan()" style="background:#27ae60;">🎥 3. 開啟相機掃描</button>

  <video id="v" autoplay playsinline webkit-playsinline muted></video>
  <canvas id="c" style="display:none"></canvas>
  <div id="res">🟢 準備就緒！</div>

<script>
  // 👇 請貼上「個人帳號」Google 網址 👇
  const API_URL = "https://script.google.com/macros/s/AKfycbwLX8XlVEbFlwR4nWUyINux1lNbd4C1MuFfCL9E8djDctdN-kxfyRTZxTxs5GgE4oxANw/exec";

  var v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d'), rD=document.getElementById('res');
  var det, scanActive=false, scannedMap = {}, currentQ = null;

  function drawQ(){
    rD.innerHTML = "⏳ 正在拿取題目...";
    document.getElementById('syncBtn').style.display = "none";
    
    fetch(API_URL + "?action=getQuiz&t=" + new Date().getTime())
    .then(res => res.json()).then(data => {
      if(data && data.length > 0) {
        currentQ = data[0];
        document.getElementById('q-box').style.display="block";
        document.getElementById('qt').innerText="題目："+currentQ.q;
        document.getElementById('opts').innerHTML="(A) "+currentQ.a+"<br>(B) "+currentQ.b+"<br>(C) "+currentQ.c+"<br>(D) "+currentQ.d;

        // 將同步指令直接綁定到實體按鈕上
        let syncUrl = `${API_URL}?action=setQuestion&q=${encodeURIComponent(currentQ.q)}&a=${encodeURIComponent(currentQ.a)}&b=${encodeURIComponent(currentQ.b)}&c=${encodeURIComponent(currentQ.c)}&d=${encodeURIComponent(currentQ.d)}&ans=${encodeURIComponent(currentQ.ans)}&t=${new Date().getTime()}`;
        
        let sBtn = document.getElementById('syncBtn');
        sBtn.href = syncUrl;
        sBtn.style.display = "block"; // 顯示紫色按鈕

        rD.innerHTML = "✅ 題目已抽出！請按紫色按鈕發射！";
        scannedMap = {}; 
      }
    }).catch(e => rD.innerHTML = "❌ 抽題失敗，請檢查網址");
  }

  function startScan(){
    // ... 原本的相機程式碼完全一樣 ...
    if(scanActive) return;
    det = new AR.Detector();
    navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}})
    .then(function(s){
      v.srcObject=s; v.style.display="block"; scanActive=true;
      rD.innerHTML = "🎥 掃描啟動！";
      document.getElementById('startBtn').innerText = "🛑 停止掃描";
      document.getElementById('startBtn').style.background = "#e74c3c";
      tick();
    });
  }

  function tick(){
    if(!scanActive) return;
    if(v.readyState === v.HAVE_ENOUGH_DATA){
      c.width=v.videoWidth; c.height=v.videoHeight;
      ctx.drawImage(v, 0, 0, c.width, c.height);
      var m=det.detect(ctx.getImageData(0, 0, c.width, c.height));
      if(m.length > 0){
        var id = m[0].id;
        if(!scannedMap[id]){
          scannedMap[id] = true;
          var ans = ["A","B","C","D"][m[0].rotation];
          rD.innerHTML = "🔄 傳送: " + id + " 號選 " + ans;
          
          let recUrl = `${API_URL}?action=record&id=${id}&ans=${ans}&t=${new Date().getTime()}`;
          let img = new Image();
          img.src = recUrl;

          rD.innerHTML = "✅ " + id + " 號送出！";
          setTimeout(() => { delete scannedMap[id]; }, 6000);
        }
      }
    }
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
