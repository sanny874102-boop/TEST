<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🔥 全班秒刷 (終極修復版)</title>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"></script>
  <style>
    body{text-align:center;font-family:sans-serif;background:#f4f4f9;padding:10px;}
    .btn{font-size:20px;padding:15px;color:white;border:none;border-radius:12px;width:90%;margin:10px auto;display:block;cursor:pointer;font-weight:bold;}
    #res{font-size:16px;font-weight:bold;margin-top:10px;padding:15px;background:#fff;border-radius:12px;border:1px solid #ddd;}
    #q-box{background:white;padding:15px;border-radius:10px;margin-bottom:10px;text-align:left;display:none;border:2px solid #f39c12;}
  </style>
</head>
<body>
  <h2>🔥 全班秒刷 (終極修復版)</h2>
  <div id="q-box">
    <b id="qt" style="font-size:22px;color:#d35400;">等待抽題...</b><br>
    <div id="opts" style="font-size:18px;line-height:1.6;"></div>
  </div>
  <button class="btn" onclick="drawQ()" style="background:#f39c12;">🎲 1. 隨機抽題</button>
  <button class="btn" onclick="startScan()" style="background:#27ae60;">🎥 2. 開始掃描</button>
  <div id="res">🟢 引擎已就緒</div>

<script>
  // 🌟 已填入您剛才提供的正確門牌
  const API_URL = "https://script.google.com/macros/s/AKfycbwRLe2VvIOZLRlQVNy2VM6eKR13gYDc2mXDpeZuZNL9tDtmdVBkHJZAXeyuDQ9u4n0aVQ/exec";

  var currentQ = null, rD = document.getElementById('res');

  function drawQ(){
    rD.innerHTML = "⏳ 正在抽題...";
    fetch(API_URL + "?action=getQuiz&t=" + Date.now())
    .then(res => res.json()).then(data => {
      currentQ = data[0];
      document.getElementById('q-box').style.display="block";
      document.getElementById('qt').innerText="題目："+currentQ.q;
      document.getElementById('opts').innerHTML="(A) "+currentQ.a+"<br>(B) "+currentQ.b+"<br>(C) "+currentQ.c+"<br>(D) "+currentQ.d;
      
      rD.innerHTML = "🚀 同步發射中...";
      
      // 🌟 強力發射連動信號
      let syncUrl = `${API_URL}?action=setQuestion&q=${encodeURIComponent(currentQ.q)}&a=${encodeURIComponent(currentQ.a)}&b=${encodeURIComponent(currentQ.b)}&c=${encodeURIComponent(currentQ.c)}&d=${encodeURIComponent(currentQ.d)}&ans=${encodeURIComponent(currentQ.ans)}&t=${Date.now()}`;
      
      fetch(syncUrl, {mode: 'no-cors'}).then(() => {
        rD.innerHTML = "✅ 指令已送出！請看大螢幕 B3！";
      }).catch(err => {
        rD.innerHTML = "❌ 同步失敗：" + err;
      });
    });
  }

  function startScan() { alert("請先確認連動成功再啟動掃描"); }
</script>
</body>
</html>
