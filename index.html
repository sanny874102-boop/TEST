<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🔥 全班秒刷-全透明除錯版</title>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"></script>
  <style>
    body{text-align:center;font-family:sans-serif;background:#f0f0f0;padding:10px;margin:0;}
    .btn{font-size:20px;padding:15px;color:white;border:none;border-radius:10px;width:90%;margin:10px auto;display:block;cursor:pointer;font-weight:bold;}
    #res{font-size:16px;font-weight:bold;margin-top:10px;color:#d35400;padding:10px;background:#fff;border-radius:10px;border:1px solid #ccc;}
    /* 🕵️ 監視小視窗樣式 */
    #monitor-box { width: 90%; height: 100px; margin: 10px auto; border: 2px solid #333; background: #eee; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <h2>🔥 個人帳號版 - 測試 1 </h2>
  
  <div id="res">🟢 請先按「載入測試」</div>

  <button class="btn" onclick="prepareTest()" style="background:#f39c12;">🎲 1. 準備測試題目</button>
  <button class="btn" id="syncBtn" onclick="sendTest()" style="background:#3498db; display:none;">⏭️ 2. 發射到大螢幕</button>

  <p style="font-size:12px; color:red;">👇 以下是 Google 大腦的真實反應視窗 👇</p>
  <div id="monitor-box">
    <iframe id="monitor" name="monitor"></iframe>
  </div>

<script>
  // 👇 重要！請貼上讓您 B3 變色成功的那個 Google 部署網址 👇
  const API_URL = "https://script.google.com/macros/s/AKfycbwN0-ACXfy5iTpsRmnzPhEi2hs23wvIYD90GyjD8IO4dZDQjbQLtU2jrXv6vOT9sw0ljg/exec";

  function prepareTest(){
    document.getElementById('res').innerHTML = "📝 已準備測試內容：<b>連動成功</b>";
    document.getElementById('syncBtn').style.display = "block";
  }

  function sendTest() {
    document.getElementById('res').innerHTML = "⏳ 正在強力發射...";
    
    // 構建測試網址
    let testUrl = API_URL + "?action=setQuestion&q=" + encodeURIComponent("連動成功") + 
                  "&ans=A&a=成功&b=失敗&c=再試&d=加油&t=" + new Date().getTime();

    // 🚀 使用 iframe 直接打開網址，Safari 絕對無法攔截，且我們能看到結果！
    document.getElementById('monitor').src = testUrl;

    setTimeout(() => {
        document.getElementById('res').innerHTML = "✅ 指令已送達！請查看 B3 有沒有變！";
    }, 2000);
  }
</script>
</body>
</html>
